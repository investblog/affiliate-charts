name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # eslint 10 needs ^20.19.0 || ^22.13.0 || >=24; package.json engines says >=22.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # A gate, not a report (ADR 012): exits 1 above a file's budget in package.json config.sizeBudget.
      - name: Size gate
        run: npm run -s size
      # The module pattern through a bundler (ADR 008): a consumer built with Vite from node_modules.
      - name: Bundle gate
        run: npm run -s gate:bundle

      # The package as a consumer gets it: packed, installed into an empty directory, then loaded the
      # ways the README promises — a default import from ESM and require().
      - name: Tarball contents and consumer smoke test
        run: |
          NAME="$(node -p "require('./package.json').name")"
          TARBALL="$(npm pack --silent)"
          for f in charts.js charts.min.js charts.d.ts charts-funnel.js charts-funnel.min.js charts-funnel.d.ts package.json README.md LICENSE CHANGELOG.md; do
            tar -tzf "$TARBALL" | grep -qx "package/$f" || { echo "::error::$f missing from the tarball"; exit 1; }
          done
          APP="$RUNNER_TEMP/consumer"
          mkdir -p "$APP" && cd "$APP" && npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL" > /dev/null
          node --input-type=module -e "import C from '$NAME/charts-funnel.js'; if (!C.funnel([{ label: 'a', value: 1, display: '1' }]).startsWith('<svg')) process.exit(1);"
          node -e "const C = require('$NAME/charts-funnel.js'); if (!C.funnel([{ label: 'a', value: 1, display: '1' }]).startsWith('<svg')) process.exit(1);"
