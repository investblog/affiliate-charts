name: Bootstrap publish (one-time)

# ONE-TIME use, to create the package on npm so that Trusted Publishing can be configured for it:
# npm has no package Settings page until the package exists. Same pattern as the family.
#
#   1. The npm account must be publish-ready (no recovery-code sign-in in the last 72 hours).
#   2. npmjs.com → Access Tokens → Granular: All packages; Read and write (publish and stage);
#      Bypass 2FA; the shortest expiry.
#   3. Repo → Settings → Secrets and variables → Actions → NPM_TOKEN, pasted by hand.
#   4. Actions → "Bootstrap publish (one-time)" → Run workflow (from main).
#
# THE SAME DAY it succeeds: configure the Trusted Publisher (investblog / affiliate-charts /
# release.yml), delete the NPM_TOKEN secret, revoke the token on npmjs.com, delete this file.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance attestation (auth is still NPM_TOKEN)

jobs:
  publish:
    # From main only: there is no tag to check the version against
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install -g npm@latest

      # npm sends the token as an HTTP header: whitespace fails with "not a legal HTTP header value",
      # which names neither cause nor fix. Only lengths are printed, never the value.
      - name: Check the secret is present and well formed
        env:
          RAW: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$RAW" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          LEN=$(printf '%s' "$RAW" | wc -c | tr -d ' ')
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]' | wc -c | tr -d ' ')
          if [ "$LEN" -ne "$CLEAN" ]; then
            echo "::error::NPM_TOKEN contains whitespace or a line break. Re-paste exactly one token."
            exit 1
          fi
          case "$RAW" in
            npm_*) ;;
            *) echo "::error::NPM_TOKEN does not start with npm_ — is it a granular access token?"; exit 1 ;;
          esac

      # a published version can never be freed: refuse the placeholder and a duplicate
      - name: Refuse a placeholder or an already-published version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" = "0.0.0" ]; then
            echo "::error::version is still 0.0.0 — run 'npm version minor' and push the branch first."
            exit 1
          fi
          if npm view "$NAME@$PKG" version > /dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already on the registry. Releases go through release.yml."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Gates
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm run -s size
          npm run -s gate:bundle

      - name: Verify the tarball
        run: |
          TARBALL="$(npm pack --silent)"
          for f in charts.js charts.min.js charts.d.ts charts-funnel.js charts-funnel.min.js charts-funnel.d.ts package.json README.md LICENSE CHANGELOG.md; do
            tar -tzf "$TARBALL" | grep -qx "package/$f" || { echo "::error::$f missing from the published tarball"; exit 1; }
          done
          rm -f "$TARBALL"

      - name: Publish (provenance attempt over token auth)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Next steps
        run: |
          echo "Published. Now, the same day:"
          echo "  1. npmjs.com -> package -> Settings -> Trusted Publisher: GitHub Actions | investblog | affiliate-charts | release.yml"
          echo "  2. Delete the NPM_TOKEN secret and revoke the token."
          echo "  3. Delete this workflow file."
